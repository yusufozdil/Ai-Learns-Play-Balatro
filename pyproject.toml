[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "balatro-rl"
version = "0.1.0"
description = "Headless Balatro rules simulator (Rust) + RL team training"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "ruff>=0.8"]
# PyTorch with CUDA 12.8 wheels (needed for Blackwell sm_120 / RTX 50xx). Install: `make setup-train`.
train = ["torch==2.9.1"]

[tool.uv]
# `train` is opt-in (~3 GB of CUDA libs); `make test` works without it (torch tests importorskip).
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.maturin]
manifest-path = "crates/balatro-py/Cargo.toml"
python-source = "python"
module-name = "balatro_rl._engine"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS page and stdlib-only daemons: long lines / plain file handles are intentional.
"scripts/dashboard.py" = ["E501", "SIM105", "SIM115"]
"scripts/gpu_queue.py" = ["SIM105", "SIM115"]
